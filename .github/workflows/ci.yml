name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vote (Python)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: vote checks
        working-directory: vote
        run: |
          pip install -r requirements.txt
          python -m py_compile app.py

      # result (Node)
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: result checks
        working-directory: result
        run: |
          npm ci
          node --check server.js

      # worker (.NET)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"
      - name: worker build
        working-directory: worker
        run: dotnet build -c Release

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4

      # GHCR image names must be lowercase
      - name: Set image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/voting-app-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.service == 'vote' && 'final' || '' }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (tagged with commit SHA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.service == 'vote' && 'final' || '' }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
